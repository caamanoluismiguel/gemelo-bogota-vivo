# PROPUESTA. Tarjeta «el cielo de Bogotá ahora»: arma cielo/ahora.json cada 20 minutos
# y lo publica en GitHub Pages SIN hacer commit (actions/deploy-pages).
#
# Dónde debe correr: en un repo aparte y pequeño solo para lo vivo (por ejemplo
# caamanoluismiguel/gemelo-bogota-vivo), como dice panel/datos-masivos.md §A. Si corriera
# aquí, deploy-pages reemplazaría el sitio entero por solo los JSON. Por eso el trabajo no
# hace nada hasta que exista la variable de repositorio CIELO_PUBLICAR=si.
#
# Frecuencia: cada 20 minutos = 72 corridas al día. Cada corrida tarda 1 a 3 minutos y se
# cobra como mínimo 1 minuto, así que son unos 2.200 a 6.500 minutos al mes. En un repo
# público los minutos de los ejecutores estándar de GitHub son gratis
# (docs.github.com/billing, consultado el 23 nov 2026). En un repo privado ya pasaría
# los 2.000 minutos gratis del plan Free, por eso el repo vivo debe ser público.
# Por qué 20 y no 10: el METAR sale cada hora, el radar de Tablazo cada hora con unas
# horas de atraso, GOES cada 10 minutos, FIRMS unas veces al día, CAMS cada hora. Solo
# el SAB cambia cada minuto, y el gemelo no emite alertas: para eso está el IDIGER.
# Minutos 7, 27 y 47 para no caer en la hora en punto, cuando GitHub retrasa más los cron.
# GitHub puede atrasar o saltar corridas programadas; la tarjeta muestra la edad de cada
# dato, así que un atraso se ve y no se esconde.
name: cielo

on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: cielo
  cancel-in-progress: false

jobs:
  armar:
    if: vars.CIELO_PUBLICAR == 'si'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # URL pública donde quedó el ahora.json anterior; se usa como respaldo si una fuente falla.
      ANTERIOR: ${{ vars.CIELO_URL_PUBLICADA }}
    steps:
      - name: Traer el código del gemelo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: caamanoluismiguel/gemelo-bogota
          fetch-depth: 1
          persist-credentials: false

      - name: Recuperar la imagen GOES anterior
        # deploy-pages reemplaza todo; si GOES falla, el JSON de respaldo apunta a esta copia.
        run: |
          mkdir -p _site/cielo
          if [ -n "$ANTERIOR" ]; then
            curl -fsS --max-time 30 -o _site/cielo/goes19-bogota.jpg \
              "${ANTERIOR%/ahora.json}/goes19-bogota.jpg" || rm -f _site/cielo/goes19-bogota.jpg
          fi

      - name: Armar ahora.json
        # Python del sistema, sin paquetes externos ni claves.
        run: |
          python3 --version
          if [ -n "$ANTERIOR" ]; then
            python3 -I pipelines/cielo/cielo.py --salida _site/cielo --anterior "$ANTERIOR?t=$(date +%s)"
          else
            python3 -I pipelines/cielo/cielo.py --salida _site/cielo
          fi
          ls -la _site/cielo
          tam=$(stat -c %s _site/cielo/ahora.json)
          if [ "$tam" -gt 51200 ]; then echo "ahora.json pesa $tam bytes, más de 50 KB"; exit 1; fi

      - name: Subir el artefacto de Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  publicar:
    needs: armar
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Publicar en Pages
        id: despliegue
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
